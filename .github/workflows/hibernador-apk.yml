name: Hibernador APK

on:
  push:
    paths:
      - "Hibernador/**"
      - ".github/workflows/hibernador-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hibernador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hibernador-debug-apk
          path: Hibernador/app/build/outputs/apk/debug/*.apk
